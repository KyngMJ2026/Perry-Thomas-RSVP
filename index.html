<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarome Perry & Aaron Thomas Jr. | Wedding RSVP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="invite-wrap">
  <img class="invite-image" src="images/wedding-top.png" alt="Aaron and Jarome winter wonderland wedding invitation">
  <div class="invitation-actions">
    <p>PLEASE CLICK AN OPTION BELOW TO RSVP</p>
    <div class="action-buttons">
      <button class="image-style-btn" type="button" onclick="chooseResponse('Happily accepts')">
        <strong>I'LL BE THERE</strong><small>Accepts with pleasure</small>
      </button>
      <button class="image-style-btn" type="button" onclick="chooseResponse('Unable to attend')">
        <strong>CAN'T MAKE IT</strong><small>Declines with regret</small>
      </button>
    </div>
  </div>

</div>

<section id="rsvp" class="rsvp-section">
  <div class="snow-left"></div>
  <div class="snow-right"></div>

  <div class="form-shell">
    <h2>RSVP BY 01/31/2027</h2>
    <div class="snow-mark">❄</div>
    <p class="form-intro">PLEASE FILL OUT THE INFORMATION BELOW</p>

    <form onsubmit="return submitPreview(event)">
      <div class="grid two">
        <label>
          Full Name(s)<span>*</span>
          <input type="text" name="name" placeholder="Enter your full name(s)" required>
        </label>

        <label>
          Phone Number<span>*</span>
          <input type="tel" name="phone" placeholder="(000) 000-0000" required>
        </label>

        <label>
          Email Address<span>*</span>
          <input type="email" name="email" placeholder="your.email@example.com" required>
        </label>

        <label>
          Will you be attending?<span>*</span>
          <select id="attendance" name="attendance" required>
            <option value="">Select an option</option>
            <option value="Happily accepts">Happily accepts</option>
            <option value="Unable to attend">Unable to attend</option>
          </select>
        </label>
      </div>

      <label>
        Dietary Restrictions / Allergies
        <textarea name="dietary" rows="4" placeholder="Please list any dietary restrictions or allergies"></textarea>
      </label>

      <label>
        Additional Comments <small>(Optional)</small>
        <textarea name="comments" rows="4" placeholder="Anything else we should know?"></textarea>
      </label>

      <button class="submit-btn" type="submit">❄ &nbsp; SUBMIT RSVP &nbsp; ❄</button>
      <p id="message" class="message"></p>
    </form>

    <p class="closing">We can't wait to celebrate with you!</p>
    <div class="bottom-mark">— ❄ —</div>
  </div>
</section>

<script>
function chooseResponse(value) {
  const select = document.getElementById('attendance');
  select.value = value;
  document.getElementById('rsvp').scrollIntoView({behavior:'smooth'});
  setTimeout(() => select.focus(), 700);
}

function submitPreview(event) {
  event.preventDefault();
  document.getElementById('message').textContent =
    'Your RSVP form is ready. The next step is connecting submissions to Google Sheets.';
  return false;
}
</script>

</body>
</html>
